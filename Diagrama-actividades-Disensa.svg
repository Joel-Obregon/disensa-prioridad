<path d="M 430 216 L 430 248" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M 430 288 L 430 309" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M 430 395 L 430 452" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="438" y="428" font-size="10.5" fill="#333">Si</text>
<path d="M 345 352 L 307 352" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="300" y="344" font-size="10.5" fill="#333">No</text>
<path d="M 187 374 L 187 408" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M 187 452 L 187 472 L 268 472" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M 430 492 L 430 528" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M 430 568 L 430 589" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M 430 675 L 430 748" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="438" y="712" font-size="10.5" fill="#333">Si</text>
<path d="M 515 632 L 648 632" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="560" y="624" font-size="10.5" fill="#333">No</text>
<path d="M 795 654 L 795 688" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M 795 740 L 795 770 L 572 770" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M 430 792 L 430 824" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
</svg>